<svg width="1100" height="580" viewBox="0 0 1100 580" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#64748b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1100" height="580" fill="#ffffff"/>

  <text x="550" y="28" text-anchor="middle" font-size="15" font-weight="600" fill="#64748b">Lab Network — Zone Overview</text>

  <!-- WAN -->
  <rect x="350" y="50" width="400" height="85" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="550" y="80" text-anchor="middle" font-size="15" font-weight="700" fill="#991b1b">WAN — Internet-Facing Edge</text>
  <text x="550" y="101" text-anchor="middle" font-size="11.5" fill="#7f1d1d">Kali Linux — attacker-perspective testing,</text>
  <text x="550" y="117" text-anchor="middle" font-size="11.5" fill="#7f1d1d">isolated, powered on only during exercises</text>

  <line x1="550" y1="135" x2="550" y2="161" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow2)"/>

  <!-- Firewall -->
  <rect x="60" y="165" width="980" height="65" rx="10" fill="#1e293b"/>
  <path d="M98,186 L112,186 L112,197 Q112,206 105,210 Q98,206 98,197 Z" fill="#ffffff"/>
  <text x="550" y="194" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">OPNsense Firewall — Default-Deny Segmentation</text>
  <text x="550" y="213" text-anchor="middle" font-size="11.5" fill="#cbd5e1">A zone is only reachable through here — never directly from another zone</text>

  <line x1="210" y1="230" x2="210" y2="261" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow2)"/>
  <line x1="550" y1="230" x2="550" y2="261" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow2)"/>
  <line x1="890" y1="230" x2="890" y2="261" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow2)"/>

  <!-- SERVERS zone -->
  <rect x="60" y="265" width="300" height="210" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/>
  <circle cx="210" cy="310" r="26" fill="#1e293b"/>
  <text x="210" y="316" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">DC</text>
  <text x="210" y="358" text-anchor="middle" font-size="10.5" font-weight="700" letter-spacing="1.5" fill="#94a3b8">SERVERS</text>
  <text x="210" y="386" text-anchor="middle" font-size="16.5" font-weight="700" fill="#0f172a">Domain Controller</text>
  <text x="210" y="416" text-anchor="middle" font-size="12" fill="#64748b">Core identity system —</text>
  <text x="210" y="436" text-anchor="middle" font-size="12" fill="#64748b">logins, permissions, DNS</text>

  <!-- USERS zone -->
  <rect x="400" y="265" width="300" height="210" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/>
  <circle cx="550" cy="310" r="26" fill="#0d9488"/>
  <circle cx="550" cy="302" r="6" fill="#ffffff"/>
  <path d="M538,320 Q550,304 562,320 L562,322 Q550,312 538,322 Z" fill="#ffffff"/>
  <text x="550" y="358" text-anchor="middle" font-size="10.5" font-weight="700" letter-spacing="1.5" fill="#94a3b8">USERS</text>
  <text x="550" y="386" text-anchor="middle" font-size="16.5" font-weight="700" fill="#0f172a">Employee Workstation</text>
  <text x="550" y="416" text-anchor="middle" font-size="12" fill="#64748b">Everyday work — isolated</text>
  <text x="550" y="436" text-anchor="middle" font-size="12" fill="#64748b">from admin &amp; server systems</text>

  <!-- ADMIN zone -->
  <rect x="740" y="265" width="300" height="210" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/>
  <circle cx="890" cy="310" r="26" fill="#d97706"/>
  <text x="890" y="316" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">IT</text>
  <text x="890" y="358" text-anchor="middle" font-size="10.5" font-weight="700" letter-spacing="1.5" fill="#94a3b8">ADMIN</text>
  <text x="890" y="386" text-anchor="middle" font-size="16.5" font-weight="700" fill="#0f172a">IT Admin Workstation</text>
  <text x="890" y="416" text-anchor="middle" font-size="12" fill="#64748b">Scoped admin access only —</text>
  <text x="890" y="436" text-anchor="middle" font-size="12" fill="#64748b">isolated from everyday users</text>

  <text x="550" y="520" text-anchor="middle" font-size="12.5" font-style="italic" fill="#64748b">Each zone can only be reached through the firewall — never directly from another zone.</text>
</svg>

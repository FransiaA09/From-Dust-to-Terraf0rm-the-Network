<svg width="1280" height="1040" viewBox="0 0 1280 1040" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#64748b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1280" height="1040" fill="#ffffff"/>

  <!-- Title -->
  <text x="640" y="45" text-anchor="middle" font-size="27" font-weight="700" fill="#0f172a">Home-Lab MSP Network — Hardening Progress</text>
  <text x="640" y="70" text-anchor="middle" font-size="13.5" fill="#475569">Internal AD / identity environment for a small (~20–25 person) managed service provider · Milestones M1–M4</text>

  <!-- Legend -->
  <g font-size="11.5" fill="#334155">
    <circle cx="300" cy="96" r="5" fill="#2563eb"/><text x="312" y="100">M1 — Segmentation</text>
    <circle cx="470" cy="96" r="5" fill="#7c3aed"/><text x="482" y="100">M2 — Identity (AD)</text>
    <circle cx="640" cy="96" r="5" fill="#0d9488"/><text x="652" y="100">M3 — Protocol Hardening</text>
    <circle cx="840" cy="96" r="5" fill="#d97706"/><text x="852" y="100">M4 — Account &amp; Audit Hardening</text>
  </g>

  <!-- WAN zone -->
  <rect x="390" y="115" width="500" height="80" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="640" y="142" text-anchor="middle" font-size="14" font-weight="700" fill="#991b1b">WAN — Internet-Facing Edge (simulated)</text>
  <text x="640" y="162" text-anchor="middle" font-size="11" fill="#7f1d1d">Kali Linux — attacker-perspective testing, staged only during</text>
  <text x="640" y="177" text-anchor="middle" font-size="11" fill="#7f1d1d">exercises, fully isolated otherwise</text>

  <line x1="640" y1="195" x2="640" y2="216" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Firewall -->
  <rect x="60" y="222" width="1160" height="58" rx="8" fill="#1e293b"/>
  <text x="640" y="248" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">OPNsense Firewall — Default-Deny Zone Segmentation</text>
  <text x="640" y="266" text-anchor="middle" font-size="11" fill="#cbd5e1">Only explicitly allowed traffic passes between zones — no standing exception today</text>
  <rect x="1150" y="232" width="38" height="20" rx="4" fill="#2563eb"/>
  <text x="1169" y="246" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">M1</text>

  <line x1="240" y1="280" x2="240" y2="306" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="640" y1="280" x2="640" y2="306" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="1040" y1="280" x2="1040" y2="306" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- SERVERS zone box -->
  <rect x="60" y="310" width="360" height="510" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
  <text x="80" y="340" font-size="15" font-weight="700" fill="#0f172a">SERVERS — Domain Controller (DC01)</text>
  <line x1="75" y1="352" x2="405" y2="352" stroke="#e2e8f0"/>
  <text x="80" y="370" font-size="11" font-style="italic" fill="#64748b">Core identity system — logins, permissions, DNS</text>
  <line x1="75" y1="382" x2="405" y2="382" stroke="#e2e8f0"/>

  <!-- S control 1 (M2) -->
  <circle cx="80" cy="410" r="4" fill="#7c3aed"/>
  <text x="92" y="414" font-size="12.5" font-weight="600" fill="#1e293b">Central directory of who can log in</text>
  <text x="92" y="429" font-size="12.5" font-weight="600" fill="#1e293b">and what they can access</text>
  <text x="92" y="444" font-size="10.5" fill="#64748b">Active Directory Domain Services —</text>
  <text x="92" y="457" font-size="10.5" fill="#64748b">OU &amp; group structure</text>

  <!-- S control 2 (M4) -->
  <circle cx="80" cy="478" r="4" fill="#d97706"/>
  <text x="92" y="482" font-size="12.5" font-weight="600" fill="#1e293b">Accounts lock out after 5 failed</text>
  <text x="92" y="497" font-size="12.5" font-weight="600" fill="#1e293b">login attempts</text>
  <text x="92" y="512" font-size="10.5" fill="#64748b">Account Lockout Policy — threshold</text>
  <text x="92" y="525" font-size="10.5" fill="#64748b">5, 30-min duration</text>

  <!-- S control 3 (M4) -->
  <circle cx="80" cy="546" r="4" fill="#d97706"/>
  <text x="92" y="550" font-size="12.5" font-weight="600" fill="#1e293b">Every sign-in and admin action is</text>
  <text x="92" y="565" font-size="12.5" font-weight="600" fill="#1e293b">logged</text>
  <text x="92" y="580" font-size="10.5" fill="#64748b">Advanced Audit Policy — Logon/Logoff,</text>
  <text x="92" y="593" font-size="10.5" fill="#64748b">Account Logon, Account Management</text>

  <!-- S control 4 (M4) -->
  <circle cx="80" cy="614" r="4" fill="#d97706"/>
  <text x="92" y="618" font-size="12.5" font-weight="600" fill="#1e293b">Outdated login protocol (NTLM) is</text>
  <text x="92" y="633" font-size="12.5" font-weight="600" fill="#1e293b">watched, not silently allowed</text>
  <text x="92" y="648" font-size="10.5" fill="#64748b">NTLM restricted to audit-only mode</text>
  <text x="92" y="661" font-size="10.5" fill="#64748b">— visibility before enforcement</text>

  <!-- S control 5 (M3) -->
  <circle cx="80" cy="682" r="4" fill="#0d9488"/>
  <text x="92" y="686" font-size="12.5" font-weight="600" fill="#1e293b">A known legacy password-storage</text>
  <text x="92" y="701" font-size="12.5" font-weight="600" fill="#1e293b">weakness is closed</text>
  <text x="92" y="716" font-size="10.5" fill="#64748b">LAN Manager hash storage disabled</text>

  <!-- S control 6 (M3) -->
  <circle cx="80" cy="740" r="4" fill="#0d9488"/>
  <text x="92" y="744" font-size="12.5" font-weight="600" fill="#1e293b">File-sharing traffic can't be</text>
  <text x="92" y="759" font-size="12.5" font-weight="600" fill="#1e293b">tampered with in transit</text>
  <text x="92" y="774" font-size="10.5" fill="#64748b">SMB signing enforced</text>

  <!-- ADMIN zone box -->
  <rect x="460" y="310" width="360" height="330" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
  <text x="480" y="340" font-size="15" font-weight="700" fill="#0f172a">ADMIN — IT Support Workstation</text>
  <text x="480" y="357" font-size="11" fill="#64748b">(win10-tech01)</text>
  <line x1="475" y1="367" x2="805" y2="367" stroke="#e2e8f0"/>
  <text x="480" y="384" font-size="11" font-style="italic" fill="#64748b">Where IT administration happens —</text>
  <text x="480" y="398" font-size="11" font-style="italic" fill="#64748b">kept separate from daily work</text>
  <line x1="475" y1="408" x2="805" y2="408" stroke="#e2e8f0"/>

  <!-- A control 1 (M4) -->
  <circle cx="480" cy="432" r="4" fill="#d97706"/>
  <text x="492" y="436" font-size="12.5" font-weight="600" fill="#1e293b">IT admin account can only do what</text>
  <text x="492" y="451" font-size="12.5" font-weight="600" fill="#1e293b">its job needs — not everything</text>
  <text x="492" y="466" font-size="10.5" fill="#64748b">Delegated rights — not a Domain</text>
  <text x="492" y="479" font-size="10.5" fill="#64748b">Admin account</text>

  <!-- A control 2 (M4) -->
  <circle cx="480" cy="500" r="4" fill="#d97706"/>
  <text x="492" y="504" font-size="12.5" font-weight="600" fill="#1e293b">Admin account only works from this</text>
  <text x="492" y="519" font-size="12.5" font-weight="600" fill="#1e293b">one machine</text>
  <text x="492" y="534" font-size="10.5" fill="#64748b">Logon restricted to the ADMIN</text>
  <text x="492" y="547" font-size="10.5" fill="#64748b">workstation</text>

  <!-- A control 3 (M1) -->
  <circle cx="480" cy="568" r="4" fill="#2563eb"/>
  <text x="492" y="572" font-size="12.5" font-weight="600" fill="#1e293b">This workstation can't be reached</text>
  <text x="492" y="587" font-size="12.5" font-weight="600" fill="#1e293b">from the internet</text>
  <text x="492" y="602" font-size="10.5" fill="#64748b">Default-deny firewall — no inbound</text>
  <text x="492" y="615" font-size="10.5" fill="#64748b">WAN rule</text>

  <!-- USERS zone box -->
  <rect x="860" y="310" width="360" height="270" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
  <text x="880" y="340" font-size="15" font-weight="700" fill="#0f172a">USERS — Employee Workstation</text>
  <text x="880" y="357" font-size="11" fill="#64748b">(win10-client01)</text>
  <line x1="875" y1="367" x2="1205" y2="367" stroke="#e2e8f0"/>
  <text x="880" y="384" font-size="11" font-style="italic" fill="#64748b">Everyday work machine — isolated</text>
  <text x="880" y="398" font-size="11" font-style="italic" fill="#64748b">from admin &amp; server systems</text>
  <line x1="875" y1="408" x2="1205" y2="408" stroke="#e2e8f0"/>

  <!-- U control 1 (M1) -->
  <circle cx="880" cy="432" r="4" fill="#2563eb"/>
  <text x="892" y="436" font-size="12.5" font-weight="600" fill="#1e293b">An employee's computer can't reach</text>
  <text x="892" y="451" font-size="12.5" font-weight="600" fill="#1e293b">the Domain Controller directly</text>
  <text x="892" y="466" font-size="10.5" fill="#64748b">Default-deny between USERS and</text>
  <text x="892" y="479" font-size="10.5" fill="#64748b">SERVERS zone</text>

  <!-- U control 2 (M1) -->
  <circle cx="880" cy="500" r="4" fill="#2563eb"/>
  <text x="892" y="504" font-size="12.5" font-weight="600" fill="#1e293b">An employee's computer can't reach</text>
  <text x="892" y="519" font-size="12.5" font-weight="600" fill="#1e293b">IT admin systems either</text>
  <text x="892" y="534" font-size="10.5" fill="#64748b">Default-deny between USERS and</text>
  <text x="892" y="547" font-size="10.5" fill="#64748b">ADMIN zone</text>

  <!-- Footer: verification evidence -->
  <rect x="60" y="870" width="6" height="130" fill="#16a34a"/>
  <rect x="66" y="870" width="1154" height="130" fill="#f1f5f9"/>
  <text x="90" y="898" font-size="14.5" font-weight="700" fill="#0f172a">Verified in Testing — Not Just Configured</text>

  <circle cx="96" cy="918" r="7" fill="#16a34a"/>
  <text x="96" y="921" text-anchor="middle" font-size="9" fill="#ffffff" font-weight="700">&#10003;</text>
  <text x="112" y="922" font-size="12.5" font-weight="700" fill="#1e293b">Event 4740</text>
  <text x="112" y="937" font-size="11" fill="#475569">Account lockout confirmed on the 5th failed logon attempt</text>

  <circle cx="656" cy="918" r="7" fill="#16a34a"/>
  <text x="656" y="921" text-anchor="middle" font-size="9" fill="#ffffff" font-weight="700">&#10003;</text>
  <text x="672" y="922" font-size="12.5" font-weight="700" fill="#1e293b">Event 8002</text>
  <text x="672" y="937" font-size="11" fill="#475569">NTLM audit (incoming) confirmed firing in audit-only mode</text>

  <circle cx="96" cy="958" r="7" fill="#16a34a"/>
  <text x="96" y="961" text-anchor="middle" font-size="9" fill="#ffffff" font-weight="700">&#10003;</text>
  <text x="112" y="962" font-size="12.5" font-weight="700" fill="#1e293b">Events 4768 + 4769</text>
  <text x="112" y="977" font-size="11" fill="#475569">4768 confirmed as a deliberate test; 4769 confirmed via category volume (869 events)</text>

  <circle cx="656" cy="958" r="7" fill="#16a34a"/>
  <text x="656" y="961" text-anchor="middle" font-size="9" fill="#ffffff" font-weight="700">&#10003;</text>
  <text x="672" y="962" font-size="12.5" font-weight="700" fill="#1e293b">Advanced Audit Policy</text>
  <text x="672" y="977" font-size="11" fill="#475569">Subcategories confirmed applied via auditpol, post-gpupdate</text>
</svg>
